# The bot in the cloud: every 5 minutes on weekdays around US market hours,
# GitHub runs one round of the bot (cloud_run.py) and saves the state on the bot-data branch.
# The script itself checks the real NYSE calendar (holidays, half days, daylight saving).
name: Trading bot (cloud run)

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # UTC. Covers 16:00-00:55 Israel time
  workflow_dispatch:              # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: trading-bot-state        # never two runs writing the state at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the bot code
        uses: actions/checkout@v5

      - name: Get the saved state (bot-data branch)
        uses: actions/checkout@v5
        with:
          ref: bot-data
          path: cloud_data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install libraries
        run: pip install -r requirements-cloud.txt

      - name: Run one round of the bot
        env:
          BOT_DATA_DIR: cloud_data
        run: python cloud_run.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save the state
        working-directory: cloud_data
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Bot round $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q
